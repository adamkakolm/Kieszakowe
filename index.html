<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Obliczacz kieszonkowego</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      margin: 24px;
      background: #f7f7fb;
      color: #111;
    }
    .card {
      max-width: 720px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(16,24,40,0.08);
    }
    h1 { margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }
    label { font-weight: 600; }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }
    .row {
      display:flex;
      gap:8px;
      margin-top:10px;
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button#calc { background: #0366d6; color:white; }
    button#reset { background: #efefef; color:#111; }
    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      background: #f1f8ff;
      border: 1px solid #d6e9ff;
      font-size: 18px;
    }
    .breakdown {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
      background:#fff;
      padding:10px;
      border-radius:6px;
      border:1px solid #eee;
    }
    small { color:#666; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Obliczacz kieszonkowego</h1>
    <p>Reguły: ocena 1 → −10 zł, ocena 4 → +5 zł, ocena 5 → +10 zł, ocena 6 → +15 zł, nieobecność → −10 zł, spóźnienie → −5 zł.</p>

    <div class="grid">
      <label for="base">Podstawowe kieszonkowe (zł)</label>
      <input id="base" type="number" min="0" step="0.01" value="0">
    </div>

    <div class="grid">
      <label for="count1">Ile ocen 1?</label>
      <input id="count1" type="number" min="0" step="1" value="0">
    </div>

    <div class="grid">
      <label for="count4">Ile ocen 4?</label>
      <input id="count4" type="number" min="0" step="1" value="0">
    </div>

    <div class="grid">
      <label for="count5">Ile ocen 5?</label>
      <input id="count5" type="number" min="0" step="1" value="0">
    </div>

    <div class="grid">
      <label for="count6">Ile ocen 6?</label>
      <input id="count6" type="number" min="0" step="1" value="0">
    </div>

    <div class="grid">
      <label for="absences">Ile nieobecności?</label>
      <input id="absences" type="number" min="0" step="1" value="0">
    </div>

    <div class="grid">
      <label for="lates">Ile spóźnień?</label>
      <input id="lates" type="number" min="0" step="1" value="0">
    </div>

    <div class="row">
      <button id="calc">Oblicz</button>
      <button id="reset" type="button">Wyczyść</button>
      <div style="flex:1"></div>
      <small>Wynik automatycznie aktualizowany po kliknięciu "Oblicz".</small>
    </div>

    <div id="output" class="result" aria-live="polite">
      <strong>Suma:</strong> <span id="total">0,00 zł</span>
      <div id="breakdown" class="breakdown" hidden></div>
    </div>
  </div>

  <script>
    // wartości przypisane do rodzajów zdarzeń
    const VAL_1 = -10;
    const VAL_4 = 5;
    const VAL_5 = 10;
    const VAL_6 = 15;
    const PENALTY_ABSENCE = -10;
    const PENALTY_LATE = -5;

    const el = id => document.getElementById(id);

    function formatZloty(num) {
      return num.toFixed(2).replace('.', ',') + ' zł';
    }

    function calculate() {
      const base = parseFloat(el('base').value) || 0;
      const c1 = Math.max(0, parseInt(el('count1').value) || 0);
      const c4 = Math.max(0, parseInt(el('count4').value) || 0);
      const c5 = Math.max(0, parseInt(el('count5').value) || 0);
      const c6 = Math.max(0, parseInt(el('count6').value) || 0);
      const absences = Math.max(0, parseInt(el('absences').value) || 0);
      const lates = Math.max(0, parseInt(el('lates').value) || 0);

      const addFrom1 = c1 * VAL_1;
      const addFrom4 = c4 * VAL_4;
      const addFrom5 = c5 * VAL_5;
      const addFrom6 = c6 * VAL_6;
      const penaltyAbs = absences * PENALTY_ABSENCE;
      const penaltyLate = lates * PENALTY_LATE;

      const total = base + addFrom1 + addFrom4 + addFrom5 + addFrom6 + penaltyAbs + penaltyLate;

      el('total').textContent = formatZloty(total);

      const breakdown = `
        <div><strong>Rozbicie:</strong></div>
        <div>Podstawa: ${formatZloty(base)}</div>
        <div>Oceny 1 × ${c1} = ${formatZloty(addFrom1)}</div>
        <div>Oceny 4 × ${c4} = +${formatZloty(addFrom4)}</div>
        <div>Oceny 5 × ${c5} = +${formatZloty(addFrom5)}</div>
        <div>Oceny 6 × ${c6} = +${formatZloty(addFrom6)}</div>
        <div>Nieobecności × ${absences} = ${formatZloty(penaltyAbs)}</div>
        <div>Spóźnienia × ${lates} = ${formatZloty(penaltyLate)}</div>
      `;
      const bd = el('breakdown');
      bd.innerHTML = breakdown;
      bd.hidden = false;

      const output = el('output');
      if (total < 0) {
        output.style.background = '#fff2f2';
        output.style.border = '1px solid #ffd0d0';
      } else {
        output.style.background = '#f1f8ff';
        output.style.border = '1px solid #d6e9ff';
      }
    }

    el('calc').addEventListener('click', calculate);
    el('reset').addEventListener('click', () => {
      ['base','count1','count4','count5','count6','absences','lates'].forEach(id => el(id).value = '0');
      el('total').textContent = formatZloty(0);
      el('breakdown').hidden = true;
      el('output').style.background = '#f1f8ff';
      el('output').style.border = '1px solid #d6e9ff';
    });

    ['base','count1','count4','count5','count6','absences','lates'].forEach(id => {
      el(id).addEventListener('input', calculate);
    });

    calculate();
  </script>
</body>
</html>
